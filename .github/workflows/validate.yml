name: ResellerPro Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci --ignore-scripts
      - name: Type check
        run: npm run type-check
      - name: Integrity tests
        run: npm test -- --runInBand
      - name: Static pre-deploy validation
        run: npm run validate
      - name: Static production configuration validation
        run: npm run check:production-config
      - name: Production build
        run: npm run build
