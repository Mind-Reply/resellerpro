name: ResellerPro Cloudflare Release

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: resellerpro-production
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm install --ignore-scripts
      - name: Type check
        run: npm run type-check
      - name: Prisma validate
        run: npx prisma validate
      - name: Production build
        run: npm run build

  release:
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm install --ignore-scripts
      - name: Build OpenNext artifact
        run: npm run cf:build
      - name: Deploy to Cloudflare
        run: npx --yes wrangler@4.135.0 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  verify:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Verify configured health URL
        env:
          HEALTH_URL: ${{ vars.RESELLERPRO_HEALTH_URL }}
        run: |
          test -n "$HEALTH_URL"
          curl --fail --silent --show-error --location "$HEALTH_URL"
